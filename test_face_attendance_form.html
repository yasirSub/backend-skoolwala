<!DOCTYPE html>
<html>
<head>
    <title>Teacher Face Attendance Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .response { margin-top: 20px; padding: 10px; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Teacher Face Attendance Test</h1>
    
    <form id="attendanceForm">
        <div class="form-group">
            <label for="face_data">Face Data (Base64):</label>
            <textarea id="face_data" name="face_data" rows="4" required>Sample base64 encoded face data</textarea>
        </div>
        
        <div class="form-group">
            <label for="confidence">Confidence (%):</label>
            <input type="text" id="confidence" name="confidence" value="95.5">
        </div>
        
        <div class="form-group">
            <label for="device_id">Device ID:</label>
            <input type="text" id="device_id" name="device_id" value="camera_001">
        </div>
        
        <div class="form-group">
            <label for="remark">Remark:</label>
            <input type="text" id="remark" name="remark" value="Morning attendance">
        </div>
        
        <button type="submit">Submit Attendance</button>
    </form>
    
    <div class="response" id="responseArea" style="display: none;">
        <h3>Response:</h3>
        <pre id="responseContent"></pre>
    </div>

    <script>
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(this);
            const data = {};
            for (const [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            // Send request
            fetch('index.php?/api/teacherFaceAttendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
                credentials: 'same-origin' // Include cookies for session
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('responseContent').textContent = data;
                document.getElementById('responseArea').style.display = 'block';
            })
            .catch(error => {
                document.getElementById('responseContent').textContent = 'Error: ' + error;
                document.getElementById('responseArea').style.display = 'block';
            });
        });
    </script>
</body>
</html>
