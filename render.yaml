# Render Deployment Configuration

## 1. Create render.yaml
services:
  - type: web
    name: skoolwala-backend
    env: php
    buildCommand: echo "No build needed"
    startCommand: php -S 0.0.0.0:$PORT
    healthCheckPath: /api/test
    envVars:
      - key: APP_ENV
        value: production

